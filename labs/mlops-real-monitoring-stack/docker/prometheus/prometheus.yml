# Real Prometheus config: scrapes the real FastAPI app's /metrics endpoint over the compose
# network. Intervals are short (2s) on purpose so the lab's automated tests (and a human running
# this by hand) see fresh data and firing alerts within tens of seconds instead of minutes.
global:
  scrape_interval: 2s
  evaluation_interval: 2s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: fastapi-app
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
