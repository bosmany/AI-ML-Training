name: Deploy to Fly.io

on:
  push:
    branches: [main]

# Least privilege: the default GITHUB_TOKEN gets read-only access to the repo. Nothing in this
# workflow needs to write to the repository - deploy credentials come from the FLY_API_TOKEN secret.
permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # never cancel a deploy that is already in flight

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q tests/health_check.py

  deploy:
    needs: test # never deploy code whose tests have not passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only --strategy immediate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Health-check the deployed app
        run: >
          curl --fail --silent --show-error
          --retry 10 --retry-delay 5 --retry-all-errors
          https://candidate-api.fly.dev/health

      - name: Roll back the release on failure
        if: failure() # only when the deploy or the health-check above actually failed
        run: flyctl releases rollback --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
