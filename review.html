<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Review - AI/ML: Zero to Hero</title>
<!-- theme:early -->
<script>
(function(){var t=null;try{var v=localStorage.getItem('aimlZTH_theme');if(v==='light'||v==='dark')t=v}catch(e){}
if(!t){try{t=(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'}catch(e){t='dark'}}
document.documentElement.setAttribute('data-theme',t)})();
</script>
<!-- /theme:early -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0F1117; --card:#1A1D27; --card2:#21253A; --border:#2A2D3E;
  --violet:#7C5CFC; --violet-light:#9B7FFF; --violet-bg:rgba(124,92,252,.1);
  --cyan:#00D9A6; --cyan-bg:rgba(0,217,166,.08);
  --gold:#FFB800; --gold-bg:rgba(255,184,0,.1);
  --red:#FF5757; --red-bg:rgba(255,87,87,.1); --green:#22C55E; --green-bg:rgba(34,197,94,.1);
  --text:#E8EAF0; --t2:#9196A8; --t3:#8B91A5;
  --sans:'Inter',sans-serif; --mono:'JetBrains Mono',monospace;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6}
a{color:inherit;text-decoration:none}
.wrap{max-width:760px;margin:0 auto;padding:64px 28px 100px}
.eyebrow{font-family:var(--mono);font-size:11.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--cyan);font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
.eyebrow::before{content:'';width:26px;height:1px;background:var(--cyan)}
h1{font-size:clamp(28px,5vw,40px);font-weight:800;line-height:1.1;letter-spacing:-.02em;margin-bottom:10px}
.lede{font-size:15px;color:var(--t2);margin-bottom:20px}
.nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:20px;background:var(--card);border:1px solid var(--border);font-size:12.5px;font-weight:600;color:var(--t2)}
.pill:hover{border-color:var(--violet);color:var(--violet)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-width:0}
.stat b{display:block;font-size:24px;font-weight:800;line-height:1.2}
.stat span{font-size:11.5px;color:var(--t2);font-weight:600}
.bar{height:6px;background:var(--card2);border-radius:3px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--cyan));border-radius:3px;transition:width .3s}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:24px 26px}
.tag{display:inline-flex;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--violet-bg);color:var(--violet);margin:0 6px 12px 0;max-width:100%}
.tag.warn{background:var(--gold-bg);color:var(--gold)}
.q{font-size:16.5px;font-weight:600;margin-bottom:16px;overflow-wrap:anywhere}
.q code,.opt code,.ans code{font-family:var(--mono);font-size:.9em;background:var(--card2);padding:1px 5px;border-radius:4px}
.q pre,.task{font-family:var(--mono);font-size:12.5px;font-weight:400;background:var(--card2);border:1px solid var(--border);padding:10px 12px;border-radius:8px;margin-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--text)}
.q pre code{background:none;padding:0}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.opt{display:flex;align-items:flex-start;gap:12px;width:100%;padding:12px 14px;background:var(--card2);border:1px solid var(--border);border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px;color:var(--text);text-align:left;overflow-wrap:anywhere;min-width:0}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt:focus-visible,.btn:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.opt:disabled{cursor:default}
.opt .l{flex:0 0 26px;height:26px;border-radius:6px;background:var(--border);color:var(--t2);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
.opt.correct{border-color:var(--green);background:var(--green-bg)}
.opt.correct .l{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .l{background:var(--red);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{font:inherit;font-size:13.5px;font-weight:700;padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--card2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--violet);color:var(--violet)}
.btn.primary{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.primary:hover{color:#fff;filter:brightness(1.1)}
.btn.good{border-color:var(--green);color:var(--green)}
.btn.bad{border-color:var(--red);color:var(--red)}
.ans{margin-top:14px;padding:12px 14px;border-radius:8px;font-size:13.5px;background:var(--card2);border:1px solid var(--border);overflow-wrap:anywhere}
.ans.ok{border-color:var(--green);background:var(--green-bg)}
.ans.no{border-color:var(--red);background:var(--red-bg)}
.ans strong{display:block;margin-bottom:2px}
.empty{text-align:center;padding:36px 22px}
.empty .big{font-size:38px;margin-bottom:8px}
.empty h2{font-size:20px;font-weight:800;margin-bottom:6px}
.empty p{color:var(--t2);max-width:460px;margin:0 auto 18px}
.empty .btns{justify-content:center}
.foot{margin-top:24px;font-size:12px;color:var(--t3)}
@media(max-width:600px){
  .wrap{padding:60px 16px 80px}
  .card{padding:18px 16px}
  .stat b{font-size:20px}
  .btn{flex:1 1 100%}
}
</style>

html[data-theme="light"] .star-body code,

<body>
<div class="wrap"><!-- feat:search-btn:start --><button type="button" class="aiml-sb aiml-sb-index" data-aiml-search aria-haspopup="dialog" aria-label="Search the course (Ctrl+K)" title="Search (Ctrl+K or /)"><span aria-hidden="true">🔍</span><span class="aiml-sb-t">Search</span><kbd>Ctrl K</kbd></button><!-- feat:search-btn:end -->
  <div class="eyebrow">Spaced review</div>
  <h1 id="h1">Today's review</h1>
  <p class="lede" id="lede">Questions you missed or that are due again, one at a time.</p>
  <div class="nav">
    <a class="pill" href="index.html">&larr; Course</a>
    <a class="pill" href="dashboard.html">📊 Dashboard</a>
  </div>
  <div class="stats">
    <div class="stat"><b id="st-streak">0</b><span>🔥 day streak</span></div>
    <div class="stat"><b id="st-due">0</b><span>📝 due now</span></div>
    <div class="stat"><b id="st-done">0</b><span>✅ done today</span></div>
  </div>
  <div class="bar" id="bar" hidden><i id="bar-i" style="width:0%"></i></div>
  <div id="stage" aria-live="polite"></div>
  <p class="foot">Missed items come back until you answer them correctly; correct answers return after 1 day, 3 days, then longer.</p>
</div>
<script>
(function(){
  var L = null; // set on DOMContentLoaded (learn.js is a deferred script)
  var stage = document.getElementById('stage');
  var skillParam = (new URLSearchParams(location.search)).get('skill') || '';
  var Q = {}, queue = [], pos = 0, results = [], requeued = {}, graded = false, mode = 'due';

  function esc(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // stored question HTML is re-sanitised here (imports are user supplied files)
  var KEEP = {code:1, pre:1, strong:1, em:1, b:1, i:1, br:1};
  function safe(html){
    var t = document.createElement('template'); t.innerHTML = html || '';
    (function walk(n){
      Array.prototype.slice.call(n.childNodes).forEach(function(c){
        if (c.nodeType === 3) return;
        if (c.nodeType !== 1) { n.removeChild(c); return; }
        if (!KEEP[c.tagName.toLowerCase()]) { n.replaceChild(document.createTextNode(c.textContent), c); return; }
        while (c.attributes.length) c.removeAttribute(c.attributes[0].name);
        walk(c);
      });
    })(t.content);
    var d = document.createElement('div'); d.appendChild(t.content); return d.innerHTML;
  }
  function $(id){ return document.getElementById(id); }
  function chapterHref(skillId){
    var d = L.skills(), l = d ? d.skills : [];
    for (var i = 0; i < l.length; i++) if (l[i].id === skillId) return l[i].file;
    return skillId.split('.')[0] + '/' ;
  }

  function stats(){
    var s = L.streak(), st = L.getState(), today = L.today();
    $('st-streak').textContent = s.count;
    $('st-due').textContent = L.dueItems().length;
    $('st-done').textContent = (st.activity[today] && st.activity[today].n) || 0;
  }

  function buildQueue(){
    if (skillParam) {
      mode = 'skill';
      var st = L.getState(), out = [];
      Object.keys(st.items).forEach(function(id){ if (st.items[id].skill === skillParam) out.push(Object.assign({id:id}, st.items[id])); });
      out.sort(function(a, b){ return (a.last - b.last) || (a.due < b.due ? -1 : 1); });
      return out;
    }
    return L.dueItems();
  }

  function setProgress(){
    var bar = $('bar'); bar.hidden = !queue.length || pos >= queue.length;
    $('bar-i').style.width = (queue.length ? Math.round(pos / queue.length * 100) : 0) + '%';
  }

  function empty(icon, title, msg, btns){
    stage.innerHTML = '<div class="card empty"><div class="big">' + icon + '</div><h2>' + title + '</h2><p>' + msg + '</p><div class="btns">' + btns + '</div></div>';
  }
  function renderEmpty(){
    var st = L.getState(), n = Object.keys(st.items).length;
    if (!n) {
      empty('🌱', 'Nothing to review yet', 'Finish a chapter quiz or an exercise and your answers show up here. Anything you miss is re-asked until it sticks.',
        '<a class="btn primary" href="index.html">Start a chapter</a><a class="btn" href="dashboard.html">Open dashboard</a>');
    } else if (mode === 'skill') {
      empty('🤷', 'No saved questions for this topic', 'Answer this chapter\'s quiz first, then come back.', '<a class="btn primary" href="' + esc(chapterHref(skillParam)) + '">Open chapter</a><a class="btn" href="review.html">Today\'s queue</a>');
    } else {
      var nd = L.nextDue(), msg = 'You are all caught up.';
      if (nd) { var days = L._.diffDays(L.today(), nd); msg += ' Your next review is ' + (days === 1 ? 'tomorrow' : 'in ' + days + ' days') + ' (' + nd + ').'; }
      empty('🎉', 'Nothing due today', msg, '<a class="btn primary" href="dashboard.html">See weakest topics</a><a class="btn" href="index.html">Keep learning</a>');
    }
    setProgress();
  }

  function head(id, it, q){
    var tag = '<span class="tag">' + esc(L.skillTitle(it.skill)) + '</span>';
    if (it.last === 0) tag += '<span class="tag warn">missed before</span>';
    else if (it.overdue > 0) tag += '<span class="tag warn">' + it.overdue + 'd overdue</span>';
    return tag;
  }

  function show(){
    graded = false;
    setProgress();
    if (pos >= queue.length) return summary();
    var it = queue[pos], id = it.id, q = Q[id];
    var h = '<div class="card">' + head(id, it, q);
    if (q && q.type === 'mcq' && q.opts && q.opts.length) {
      h += '<div class="q">' + safe(q.text) + '</div><div class="opts">';
      q.opts.forEach(function(o, i){ h += '<button class="opt" data-k="' + esc(o.k) + '"><span class="l">' + esc(o.k) + '</span><span>' + safe(o.t) + '</span></button>'; });
      h += '</div><div id="fb"></div><div class="btns"><button class="btn" id="giveup">Show answer</button></div>';
    } else if (q && q.type === 'text') {
      h += '<div class="q">' + safe(q.text) + '</div><div id="fb"></div><div class="btns" id="ctl"><button class="btn primary" id="reveal">Reveal answer</button></div>';
    } else if (q && q.kind === 'exercise') {
      h += '<div class="q">Exercise ' + esc(q.n) + ': ' + esc(q.title || '') + '</div>' + (q.desc ? '<p class="lede">' + esc(q.desc) + '</p>' : '') +
        (q.task ? '<div class="task">' + esc(q.task) + '</div>' : '') +
        '<div id="fb"></div><div class="btns" id="ctl"><a class="btn" target="_blank" rel="noopener" href="' + esc(chapterHref(it.skill)) + '#ex' + esc(q.n) + '">Open the exercise ↗</a><button class="btn primary" id="reveal">I tried it</button></div>';
    } else {
      h += '<div class="q">Revisit <strong>' + esc(L.skillTitle(it.skill)) + '</strong> (' + esc(id) + ').</div><div id="fb"></div><div class="btns" id="ctl"><a class="btn" target="_blank" rel="noopener" href="' + esc(chapterHref(it.skill)) + '">Open chapter ↗</a><button class="btn primary" id="reveal">Rate myself</button></div>';
    }
    stage.innerHTML = h + '</div>';
    bind(it, q);
  }

  function rate(it, ok){
    if (graded) return; graded = true;
    L.recordResult(it.id, ok, {skill: it.skill});
    results.push(ok);
    if (!ok && !requeued[it.id]) { requeued[it.id] = 1; queue.push(it); }
    stats();
  }
  function nextBtn(){
    var b = document.createElement('button'); b.className = 'btn primary'; b.id = 'next'; b.textContent = pos + 1 >= queue.length ? 'Finish' : 'Next →';
    b.onclick = function(){ pos++; show(); };
    var c = stage.querySelector('.btns') || stage; c.innerHTML = ''; c.appendChild(b); b.focus();
  }
  function verdict(ok, title, body){
    $('fb').innerHTML = '<div class="ans ' + (ok ? 'ok' : 'no') + '"><strong>' + title + '</strong>' + body + '</div>';
  }

  function bind(it, q){
    var opts = stage.querySelectorAll('.opt');
    if (opts.length) {
      var pick = function(k){
        if (graded) return;
        var ok = k === q.correct;
        opts.forEach(function(o){
          o.disabled = true;
          if (o.dataset.k === q.correct) o.classList.add('correct');
          else if (o.dataset.k === k) o.classList.add('wrong');
        });
        rate(it, ok);
        verdict(ok, ok ? 'Correct' : 'Not quite', ok ? 'Nice. This one is scheduled for later.' : 'The right answer is <strong style="display:inline">' + esc(q.correct) + '</strong>. It stays in your queue until you get it right.');
        nextBtn();
      };
      opts.forEach(function(o){ o.onclick = function(){ pick(o.dataset.k); }; });
      $('giveup').onclick = function(){ pick('-'); };
      return;
    }
    var rv = $('reveal'); if (!rv) return;
    rv.onclick = function(){
      var ans = q && q.type === 'text' ? '<div class="ans"><strong>Answer</strong>' + esc(q.expl || 'No stored answer, check the chapter.') + '</div>' : '';
      $('fb').innerHTML = ans + '<p class="lede" style="margin:12px 0 0">How did it go?</p>';
      var c = $('ctl'); c.innerHTML = '<button class="btn good" id="yes">✓ I got it</button><button class="btn bad" id="no">✗ Missed it</button>';
      $('yes').onclick = function(){ rate(it, true); $('fb').innerHTML = ans; nextBtn(); };
      $('no').onclick = function(){ rate(it, false); $('fb').innerHTML = ans; nextBtn(); };
    };
  }

  function summary(){
    var ok = results.filter(Boolean).length, n = results.length, nd = L.nextDue();
    var pct = n ? Math.round(ok / n * 100) : 0;
    empty(pct >= 80 ? '🎯' : '💪', 'Session complete', ok + ' of ' + n + ' correct (' + pct + '%). ' + (nd ? 'Next review: ' + nd + '.' : ''),
      (L.dueItems().length ? '<a class="btn primary" href="review.html">Review again</a>' : '') + '<a class="btn' + (L.dueItems().length ? '' : ' primary') + '" href="dashboard.html">Open dashboard</a><a class="btn" href="index.html">Back to the course</a>');
    stats();
    $('bar').hidden = true;
  }

  document.addEventListener('keydown', function(e){
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var t = e.target && e.target.tagName;
    if (t === 'TEXTAREA' || t === 'INPUT') return;
    var k = e.key.toUpperCase();
    if (!graded) {
      var idx = /^[1-9]$/.test(k) ? +k - 1 : 'ABCDEFGH'.indexOf(k);
      var o = stage.querySelectorAll('.opt')[idx];
      if (o && idx >= 0 && !o.disabled) { o.click(); e.preventDefault(); }
    } else if (e.key === 'Enter') {
      var nx = $('next'); if (nx && document.activeElement !== nx) { nx.click(); e.preventDefault(); }
    }
  });

  function init(){
    if (!L) { stage.innerHTML = '<div class="card empty"><h2>Could not load the learning engine</h2><p>assets/learn.js is missing.</p></div>'; return; }
    Q = L.getQuestions();
    if (skillParam) {
      $('h1').textContent = 'Practice: ' + L.skillTitle(skillParam);
      $('lede').textContent = 'Every saved item from this chapter, weakest first. Answers still update your schedule.';
    }
    stats();
    queue = buildQueue();
    if (!queue.length) return renderEmpty();
    show();
  }
  function start(){ L = window.AIML && window.AIML.learn; if (L) L.loadSkills().then(init, init); else init(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
</script>
<!-- theme:js -->
<script>
(function(){
  var KEY='aimlZTH_theme',root=document.documentElement;
  var SUN='<svg class="tt-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
  var MOON='<svg class="tt-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.5 14.2A8.6 8.6 0 0 1 9.8 3.5a8.6 8.6 0 1 0 10.7 10.7z"/></svg>';
  function valid(v){return v==='light'||v==='dark'?v:null}
  function stored(){try{return valid(localStorage.getItem(KEY))}catch(e){return null}}
  function osPref(){try{return(window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'}catch(e){return 'dark'}}
  function current(){return valid(root.getAttribute('data-theme'))||stored()||osPref()}
  var buttons=[];
  function label(b,t){
    var next=t==='light'?'dark':'light';
    b.setAttribute('aria-label','Switch to '+next+' theme (currently '+t+')');
    b.setAttribute('title','Switch to '+next+' theme');
    var l=b.querySelector('.tt-label');if(l)l.textContent=t==='light'?'Light':'Dark';
  }
  function apply(t,persist){
    root.setAttribute('data-theme',t);
    if(persist){try{localStorage.setItem(KEY,t)}catch(e){}}
    for(var i=0;i<buttons.length;i++)label(buttons[i],t);
    try{var m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',t==='light'?'#F3F4F9':'#0F1117')}catch(e){}
  }
  function make(cls){
    var b=document.createElement('button');
    b.type='button';b.className='theme-toggle '+cls;
    b.setAttribute('data-theme-toggle','');
    b.innerHTML=SUN+MOON+'<span class="tt-label"></span>';
    b.addEventListener('click',function(){apply(current()==='light'?'dark':'light',true)});
    buttons.push(b);return b;
  }
  function mount(){
    if(document.querySelector('[data-theme-toggle]'))return;
    var tb=document.getElementById('topbar'),tn=document.getElementById('topnav'),mob=document.getElementById('mob-menu'),wrap=document.querySelector('.wrap');
    if(tb){
      tb.appendChild(make('tt-desk'));
      if(mob){var mb=make('tt-mob'),mc=document.getElementById('mob-console-btn');mob.insertBefore(mb,mc||null)}
    }else if(tn){
      tn.appendChild(make('tt-nav'));
    }else if(wrap&&document.querySelector('.wrap > .eyebrow')){
      if(getComputedStyle(wrap).position==='static')wrap.style.position='relative';
      wrap.appendChild(make('tt-index'));
    }else{
      document.body.appendChild(make('tt-fixed'));
    }
    apply(current(),false);
  }
  window.addEventListener('storage',function(e){
    if(e.key===KEY||e.key===null){apply(stored()||osPref(),false)}
  });
  try{
    var mq=window.matchMedia('(prefers-color-scheme: light)');
    var onq=function(){if(!stored())apply(osPref(),false)};
    if(mq.addEventListener)mq.addEventListener('change',onq);else if(mq.addListener)mq.addListener(onq);
  }catch(e){}
  window.aimlTheme={get:current,set:function(t){if(valid(t))apply(t,true)},toggle:function(){apply(current()==='light'?'dark':'light',true)}};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',mount);else mount();
})();
</script>
