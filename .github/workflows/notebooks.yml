name: Notebooks

# Executes fastapi/*.ipynb in a temp dir and checks the committed copies stay clean
# (scripts/check-notebooks.py).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-notebooks.txt

      - name: Install dependencies (retried once)
        run: |
          install() { pip install -r scripts/requirements-notebooks.txt; }
          install || { echo "retrying after network error"; sleep 10; install; }

      - name: Execute and check notebooks
        run: python scripts/check-notebooks.py --json notebooks-report.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebooks-report
          path: notebooks-report.json
          if-no-files-found: ignore
          retention-days: 14
