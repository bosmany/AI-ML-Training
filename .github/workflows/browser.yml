name: Browser smoke

# Headless Chromium over every page: no uncaught JS errors, console dock minimize/persist,
# no horizontal scroll at 1280/1000 px, and a real lesson "Run" click (scripts/browser-smoke.py).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-browser.txt

      - name: Install Playwright
        run: pip install -r scripts/requirements-browser.txt

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('scripts/requirements-browser.txt') }}

      - name: Install Chromium browser (retried once)
        run: |
          install() { python -m playwright install --with-deps chromium; }
          install || { echo "retrying after network error"; sleep 10; install; }

      - name: Browser smoke test
        run: python scripts/browser-smoke.py --json browser-smoke.json

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: browser-smoke.json
          if-no-files-found: ignore
          retention-days: 14
