name: Report an inaccuracy
description: Something in a lesson, exercise, quiz, glossary entry or cheat sheet is wrong, misleading or out of date.
title: "[Inaccuracy] "
labels: ["accuracy", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping keep the course correct. Chapters carry an automated check badge with "human review pending", so reports like this are how mistakes get found.
  - type: input
    id: page
    attributes:
      label: Page
      description: Which page or file? Paste the URL or path (for example `python/ch06-professional-python.html`, `glossary.html` or `cheatsheets/ch06.html`).
      placeholder: python/ch06-professional-python.html
    validations:
      required: true
  - type: input
    id: section
    attributes:
      label: Section or heading
      description: The lesson heading, exercise number, quiz question or glossary term.
      placeholder: 6.7 Decorators, Step 3
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem is it?
      options:
        - Factual error (the statement is wrong)
        - Code does not run or gives different output than shown
        - Misleading or ambiguous explanation
        - Out of date (library, version or behaviour changed)
        - Quiz or exercise answer is wrong
        - Glossary or cheat sheet error
        - Something else
    validations:
      required: true
  - type: textarea
    id: quote
    attributes:
      label: What the page says
      description: Copy the exact sentence or code.
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: What you think is correct, and why
      description: Please include a source (official docs, spec, paper) or a short reproduction if it is a code problem.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser, Python or library versions (if it is a code problem)
      placeholder: Chrome 126, Pyodide 0.26.4
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the open issues and this has not been reported yet.
          required: true
